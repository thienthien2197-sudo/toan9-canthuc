<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOÁN 9 - CĂN BẬC HAI VÀ CĂN BẬC BA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study app for Grade 9, calm and clear
   IDEA a class workbook app: pick your name, watch, answer, check off
   PICTURE the video player with its watched-bar and question markers; the exam sheet with its number grid
   COLOUR Edison navy #326383 field, orange #F9AF28 action, green done, red wrong
   TYPE Be Vietnam Pro; radicals drawn so the bar covers the whole expression
   LAYOUT top bar; one main column; exam = question left, number grid right, stacked on phone */
:root{color-scheme:light dark;--bg:light-dark(#f3f6f9,#0f1a22);--pane:light-dark(#ffffff,#162531);--ink:light-dark(#17222b,#e8eef2);--soft:light-dark(#5b6872,#9fb0bc);--line:light-dark(#dde4ea,#2a3a46);--navy:#326383;--or:#F9AF28;--ok:light-dark(#3d7a1f,#8fd16a);--okbg:light-dark(#eaf3e0,#1c2e17);--no:light-dark(#c00000,#ff7a7a);--nobg:light-dark(#fbe7e7,#3a1a1a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(4vw,16px)}
.top{background:var(--navy);color:#fff}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px;flex-wrap:wrap}
.top b{margin-right:auto;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:#ffffff22;font-size:14px;white-space:nowrap;color:#fff;border:0;min-height:34px}
.demo{background:#fff4dc;color:#6b4a00;font-size:14px;text-align:center;padding:6px 12px}
.pane{background:var(--pane);border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0}
h1{font-size:clamp(26px,3.6vw,38px);line-height:1.1;letter-spacing:-.02em;margin:0 0 8px}
h2{font-size:22px;margin:0 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 20px;border-radius:12px;border:0;background:var(--navy);color:#fff;font-weight:700}
.btn.or{background:var(--or);color:#17222b}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,.opt:focus-visible,.num:focus-visible,textarea:focus-visible{outline:3px solid var(--or);outline-offset:2px}
select,textarea{font:inherit;font-size:16px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--pane);color:var(--ink);width:100%}
.login{max-width:460px;margin:7vh auto}
.note{font-size:14px;color:var(--soft)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.ring{display:flex;gap:18px;align-items:center}
.chang{font-size:15px;color:var(--soft);margin:20px 0 4px;font-weight:700}
.lesson{display:grid;grid-template-columns:3em minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.lesson.test{background:color-mix(in srgb,var(--or) 10%,transparent);border-radius:12px;padding-inline:10px}
.lesson .n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--line)}
.lesson.on .n{background:var(--or);color:#17222b}.lesson.done .n{background:var(--ok);color:#fff}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.step{font-size:13px;padding:2px 10px;border-radius:999px;background:var(--bg);color:var(--soft)}
.step.ok{background:var(--okbg);color:var(--ok);font-weight:700}
/* công thức: dấu căn kéo hết biểu thức, phân số hai tầng */
.rad{display:inline-flex;align-items:stretch;position:relative;vertical-align:middle;white-space:nowrap;margin:0 .06em}
.rad.cb{margin-left:.38em}
.rad .rs{width:.62em;flex:none;overflow:visible}
.rad .rs path{fill:none;stroke:currentColor;stroke-width:1.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.rad .rc{border-top:1.5px solid currentColor;padding:.12em .14em 0 .06em;display:inline-flex;align-items:center}
.rad .idx{position:absolute;left:-.32em;top:-.05em;font-size:.6em;line-height:1}
.fr{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;font-size:.9em;margin:0 .12em;line-height:1.25}
.fr>span{display:flex;align-items:center;justify-content:center;padding:.06em .2em}
.fr>span:first-child{border-bottom:1.4px solid currentColor}
.player{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
.player video{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;background:#0d1a24ee;color:#fff;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.ov .box{max-width:620px;width:100%}
.ov .opt{background:#ffffff14;color:#fff;border-color:#ffffff40}
.ctr{display:flex;align-items:center;gap:12px;padding:10px 0}
.bar{position:relative;flex:1;height:14px;border-radius:9px;background:var(--line);cursor:pointer}
.bar .seen{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:color-mix(in srgb,var(--navy) 45%,transparent)}
.bar .cur{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--navy)}
.bar .mk{position:absolute;top:-4px;width:10px;height:22px;margin-left:-5px;border-radius:4px;background:var(--or);border:2px solid var(--pane)}
.bar .mk.ok{background:var(--ok)}
.time{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px;color:var(--soft)}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:18px;flex:none}
.msg{min-height:24px;font-size:14px;color:var(--no)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:8px;margin-top:10px}
.opt{min-height:52px;text-align:left;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--pane);color:var(--ink);font-size:17px;display:flex;align-items:center;gap:8px}
.opt .ot{flex:1;min-width:0}
.opt.sel{border-color:var(--navy);background:color-mix(in srgb,var(--navy) 14%,var(--pane))}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--no);background:var(--nobg)}
.ov .opt.ok{background:#3d7a1f;border-color:#8fd16a}.ov .opt.no{background:#7a1f1f;border-color:#ff9a9a}
.qt{font-size:18px;font-weight:600;line-height:2}
.fb{margin-top:10px;font-size:15px}
.hintbox{margin-top:10px;padding:10px 14px;border-radius:12px;background:#fff4dc;color:#4a3300;font-size:15px}
.lock{text-align:center;padding:28px;border:2px dashed var(--line);border-radius:16px;color:var(--soft)}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.num{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--pane);color:var(--ink);font-weight:700}
.num.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.num.flag{border-color:var(--or);box-shadow:inset 0 -4px 0 var(--or)}
.num.cur{outline:3px solid var(--or);outline-offset:1px}
.timer{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy)}
.timer.low{color:var(--no)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .pane{max-width:440px;width:100%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#17222b;color:#fff;padding:10px 18px;border-radius:12px;font-size:15px;z-index:10;max-width:92vw}
.big{font-size:clamp(44px,7vw,64px);font-weight:800;line-height:1;color:var(--navy)}
.code{display:inline-block;font-weight:800;padding:1px 8px;border-radius:8px;background:var(--no);color:#fff;margin-right:6px;font-size:14px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:340px;max-height:58vh;overflow:auto;padding:14px;border-radius:14px;background:var(--bg)}
.bub{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.9}
.bub.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;background:var(--pane);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub ol,.bub ul{margin:4px 0;padding-left:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chips button{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--navy);background:var(--pane);color:var(--ink);font-size:14px}
.send{display:flex;gap:8px}
.send textarea{min-height:52px;resize:vertical}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:12px}
.kpi div{background:var(--bg);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:30px;line-height:1.1;color:var(--navy)}
.brow{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr) 4.5em;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.brow .m{height:14px;border-radius:8px;background:var(--line);overflow:hidden}.brow .m i{display:block;height:100%;background:var(--ok)}
.brow span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.r,th.r{text-align:right}
.tag{display:inline-block;padding:1px 8px;border-radius:8px;font-size:13px;font-weight:700}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.no{background:var(--nobg);color:var(--no)}.tag.mid{background:#fff4dc;color:#6b4a00}
@media(max-width:760px){.exam{grid-template-columns:minmax(0,1fr)}.exam aside{order:-1}.grid{grid-template-columns:repeat(6,minmax(0,1fr))}.brow{grid-template-columns:minmax(0,1fr) 4em}.brow .m{grid-column:1/-1;order:3}}

.btn.sm{min-height:40px;padding:6px 14px;font-size:15px}
.item{padding:14px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.fb.okc,.okc{color:var(--ok)}.noc{color:var(--no)}
.step.lockt{background:transparent;color:var(--soft)}.step.bad{background:var(--nobg);color:var(--no);font-weight:700}
.rules{margin-top:12px;font-size:15px}.rules summary{cursor:pointer;font-weight:700;color:var(--navy)}.rules ol{margin:8px 0 0;padding-left:22px}
.warn{background:#fff4dc;color:#4a3300;border-color:#f3d27c}
.ghans{list-style:decimal;margin:6px 0 12px;padding-left:28px;display:flex;flex-direction:column;gap:6px}
.ghans li.empty{list-style:none;margin-left:-28px;padding:14px;border:2px dashed var(--line);border-radius:12px;color:var(--soft);font-size:15px}
.pool{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:48px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--pane);color:var(--ink);font-size:17px;line-height:2}
.pool .card{border-style:dashed}.pool .card:hover{border-color:var(--navy)}
.ghans .card{background:color-mix(in srgb,var(--navy) 8%,var(--pane));border-color:color-mix(in srgb,var(--navy) 40%,var(--line))}
.card .x{margin-left:auto;color:var(--soft);font-size:14px}
.card.ok{border-color:var(--ok);background:var(--okbg)}.card.no{border-color:var(--no);background:var(--nobg)}
.ghsol{margin:6px 0;padding-left:26px;line-height:2.1}
.banner{margin-top:14px;padding:12px 16px;border-radius:12px;font-size:16px}.banner.ok{background:var(--okbg);color:var(--ok)}.banner.no{background:var(--nobg);color:var(--no)}
table.ds{margin-top:12px;font-size:16px}table.ds td{white-space:normal;line-height:2;vertical-align:middle}table.ds .c{text-align:center}
.tf{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--pane);color:var(--ink);font-weight:800}
.tf.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px}
.rv{padding:14px 0;border-top:1px solid var(--line)}
.qbox{margin:8px 0;padding:10px 12px;border-radius:12px;background:var(--bg);line-height:2.1}
.qbox .mini{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px}
.know{margin-top:8px;padding:8px 12px;border-left:4px solid var(--navy);background:color-mix(in srgb,var(--navy) 7%,transparent);border-radius:0 10px 10px 0;font-size:15px}
.tipbox{margin-top:6px;font-size:14px;color:var(--soft)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.keys button{min-width:48px;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--pane);color:var(--ink);font-size:17px}
.bub .code{font-size:13px}
.kk{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:#efe6ff;color:#5b2ca0;vertical-align:middle}
.lesson.tt .n{background:#fff4d6;font-size:20px}.lesson.tt.done .n{background:#ffe08a}.stars{color:#d99a00;letter-spacing:1px;font-weight:800}
.lvbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.lvbtns .btn.rec{border-color:var(--or);color:var(--or);font-weight:800}
.mine{border:2px solid #b9d3ee}.mine .lesson .n{background:#fde8e8}
.ov{align-items:flex-start}.ov>*{margin:auto 0;width:100%}
@media (max-width:760px){.player.ask{aspect-ratio:auto;overflow:visible;background:#0d1a24}.player.ask video{display:none}.player.ask .ov{position:static;display:block;padding:14px;border-radius:14px;overflow:visible}}
.ffbox{border:2px solid #f5c04a;background:#fffaf0}.item.dim{opacity:.72}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.bd{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:#eef1f5;color:#8a94a3}.bd.on{background:#fff1cc;color:#8a5a00}
.intro{border:2px solid var(--or)}.intro ol{padding-left:20px;line-height:1.6}.intro li{margin:6px 0}
.why{font-size:13px;color:#5a6472;margin-top:4px}.hintbox.sol{background:#eef7ee;border-color:#cfe6cf}
.lesson.xtra{border-top:1px dashed var(--line)}.lesson.xtra .n{background:transparent;border:2px dashed var(--line)}.lesson.xtra.on .n{border-color:var(--navy);color:var(--navy)}
.sub{font-weight:600;color:var(--soft)}
.vtabs{display:flex;flex-direction:column;gap:6px;margin:8px 0 14px}
.vtab{display:flex;align-items:center;gap:10px;text-align:left;min-height:46px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--pane);color:var(--ink);font-size:16px}
.vtab b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);flex:none;font-size:14px}
.vtab span{margin-left:auto;color:var(--soft);font-size:14px}.vtab.cur{border-color:var(--navy);background:color-mix(in srgb,var(--navy) 8%,var(--pane))}
.pv{min-height:30px;margin:0 0 8px;font-size:18px;line-height:2.2}
.keys button .fr{font-size:14px}
.scroll tr.off td{color:var(--soft)}
.vtab.ok b{background:var(--okbg);color:var(--ok)}.vtab:disabled{opacity:.55}
.card .ct{flex:1;min-width:0}
table.ds td:first-child{width:2.2em}table.ds td.c{white-space:nowrap;width:1%}table.ds{table-layout:auto}
</style>
</head>
